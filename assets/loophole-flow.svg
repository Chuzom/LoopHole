<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="loophole flow diagram">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBack" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:12;}
      .lbl{fill:#0f172a;font-size:15px;font-weight:600;}
      .sub{fill:#64748b;font-size:11.5px;}
      .flow{stroke:#94a3b8;stroke-width:2;fill:none;}
      .back{stroke:#f59e0b;stroke-width:2;fill:none;stroke-dasharray:6 5;}
      @media (prefers-color-scheme: dark){
        .bg{fill:#0b1020;}
        .box{fill:#161c2e;stroke:#334155;}
        .lbl{fill:#e2e8f0;}
        .sub{fill:#94a3b8;}
        .title{fill:#f1f5f9;}
        .tagline{fill:#94a3b8;}
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="420" fill="#f8fafc" rx="16"/>

  <!-- title -->
  <text class="title" x="40" y="52" font-size="30" font-weight="800" fill="#0f172a">loop<tspan fill="url(#accent)">hole</tspan></text>
  <text class="tagline" x="40" y="78" font-size="15" fill="#475569">A swarm of agents that won't stop until the goal is <tspan font-weight="700">provably</tspan> done.</text>

  <!-- GOAL -->
  <rect class="box" x="40" y="120" width="150" height="74" rx="12"/>
  <text class="lbl" x="115" y="150" text-anchor="middle">🎯 Goal</text>
  <text class="sub" x="115" y="170" text-anchor="middle">plain-English</text>
  <text class="sub" x="115" y="184" text-anchor="middle">+ a verifier</text>

  <!-- PLANNER -->
  <rect class="box" x="230" y="120" width="150" height="74" rx="12"/>
  <text class="lbl" x="305" y="150" text-anchor="middle">🧭 Planner</text>
  <text class="sub" x="305" y="170" text-anchor="middle">goal → task DAG</text>
  <text class="sub" x="305" y="184" text-anchor="middle">(critiqued first)</text>

  <!-- EXECUTORS -->
  <rect class="box" x="420" y="120" width="150" height="74" rx="12"/>
  <text class="lbl" x="495" y="150" text-anchor="middle">⚙️ Executors</text>
  <text class="sub" x="495" y="170" text-anchor="middle">parallel agents in</text>
  <text class="sub" x="495" y="184" text-anchor="middle">git worktrees</text>

  <!-- VERIFIER -->
  <rect x="610" y="120" width="150" height="74" rx="12" fill="url(#accent)"/>
  <text x="685" y="150" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">✅ Verifier</text>
  <text x="685" y="170" text-anchor="middle" fill="#e9e7fd" font-size="11.5">the ONLY thing</text>
  <text x="685" y="184" text-anchor="middle" fill="#e9e7fd" font-size="11.5">that says "done"</text>

  <!-- DONE -->
  <rect class="box" x="800" y="120" width="120" height="74" rx="12" stroke="#22c55e"/>
  <text class="lbl" x="860" y="150" text-anchor="middle" fill="#16a34a">🏁 Done</text>
  <text class="sub" x="860" y="170" text-anchor="middle">+ residual-risk</text>
  <text class="sub" x="860" y="184" text-anchor="middle">report</text>

  <!-- forward arrows -->
  <path class="flow" d="M190,157 L228,157" marker-end="url(#arrow)"/>
  <path class="flow" d="M380,157 L418,157" marker-end="url(#arrow)"/>
  <path class="flow" d="M570,157 L608,157" marker-end="url(#arrow)"/>
  <path class="flow" d="M760,157 L798,157" marker-end="url(#arrow)"/>

  <!-- feedback loop: verifier -> planner -->
  <path class="back" d="M685,194 L685,250 L305,250 L305,196" marker-end="url(#arrowBack)"/>
  <text x="495" y="270" text-anchor="middle" fill="#b45309" font-size="12.5" font-weight="600">not done → re-plan, retry, route around failures — never gives up</text>

  <!-- the differentiator callout -->
  <rect x="40" y="312" width="880" height="68" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="62" y="342" font-size="14.5" font-weight="700" fill="#3730a3">Why it's different</text>
  <text x="62" y="364" font-size="13" fill="#4338ca">Agents love to claim "I'm done!" — loophole doesn't believe them. Completion is granted only by a falsifiable check</text>
  <text x="62" y="380" font-size="13" fill="#4338ca">(your tests, a build, an HTTP 200). No verifier? loophole asks a human. It can't be argued into calling unfinished work done.</text>
</svg>
