[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name on PyPI. The import package stays `loophole`; the PyPI project
# is `loophole-agents` (the bare `loophole` name was already taken). Install with
# `pip install loophole-agents`, then `import loophole` / run `loophole`.
name = "loophole-agents"
version = "0.1.0"
description = "The acceptance layer for autonomous coding — 'CI for AI agents'. A swarm works until a verifier PROVES the goal is done."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ypollak2" }]
keywords = ["agents", "multi-agent", "swarm", "llm", "automation", "orchestration",
            "verification", "ci", "coding-agent", "acceptance-testing", "sandbox"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/Chuzom/loophole"
Repository = "https://github.com/Chuzom/loophole"
Issues = "https://github.com/Chuzom/loophole/issues"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "jsonschema>=4.0", "pyyaml>=6.0"]

[project.scripts]
loophole = "loophole.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["loophole*"]

[tool.setuptools.package-data]
loophole = ["templates/*.json", "schemas/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "sandbox: requires an OS sandbox such as bwrap or Seatbelt",
    "network: binds localhost sockets or exercises network egress",
    "integration: drives a full loophole run or external process boundary",
]
