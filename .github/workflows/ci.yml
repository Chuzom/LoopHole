name: ci

# Fast/core tests across supported Pythons. Sandbox and localhost-heavy
# integration coverage stays in sandbox.yml, where the runner is prepared for
# bwrap and full boundary checks.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Hard cap so a hung step (e.g. apt-get update wedging on a slow third-party
    # repo, or a deadlocked test) fails in minutes instead of churning to the 6h
    # job cap and getting cancelled. Normal run is < 2 min.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap (Linux OS sandbox)
        timeout-minutes: 5
        # Third-party apt lists (packages.microsoft.com, azure-cli) intermittently
        # hang `apt-get update` on GH runners with no timeout — we don't need them,
        # so drop them first, then retry a couple of times on transient failure.
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/*azure* 2>/dev/null || true
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && break
            echo "apt-get update failed (attempt $i), retrying..."; sleep 5
          done
          sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces (bwrap on Ubuntu 24.04+)
        # ubuntu-latest restricts unprivileged userns via AppArmor, which breaks
        # bwrap --unshare; relax it for CI so sandboxed tests run.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Run the core suite
        run: LOOPHOLE_TEST_PROFILE=core pytest -q
