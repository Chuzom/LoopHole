name: ci

# The full test suite across supported Pythons. The OS sandbox path (Seatbelt on
# macOS / bubblewrap on Linux) is exercised here under bwrap — so this is also the
# real proof the sandbox + verifier boundary hold, not just unit logic.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install bubblewrap (Linux OS sandbox)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow unprivileged user namespaces (bwrap on Ubuntu 24.04+)
        # ubuntu-latest restricts unprivileged userns via AppArmor, which breaks
        # bwrap --unshare; relax it for CI so sandboxed tests run.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'
      - name: Run the full suite
        run: pytest -q
